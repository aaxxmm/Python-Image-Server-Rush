events {
    worker_connections 1024;
}

http {
    # Настройки
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логи
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Оптимизация
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 5M;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        # Корневая директория для статики
        root /usr/share/nginx/html;

        # Раздача изображений
        location /images/ {
            alias /usr/share/nginx/html/images/;

            # Кэширование
            expires 30d;
            add_header Cache-Control "public, immutable";

            # Безопасность
            add_header X-Content-Type-Options nosniff;

            # Разрешенные методы
            limit_except GET HEAD {
                deny all;
            }
        }

        # Проксирование запросов к бэкенду
        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Буферизация
            proxy_buffering off;
            proxy_http_version 1.1;
        }

        # Health check для Nginx
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}