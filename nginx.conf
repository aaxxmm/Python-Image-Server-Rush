events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логи
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Оптимизация
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 5M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # ============================================================
        # 1. API: ЗАГРУЗКА ИЗОБРАЖЕНИЙ → Python-бэкенд
        # Только POST, точное совпадение (не затрагивает upload.html!)
        # ============================================================
        location = /upload {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ============================================================
        # 2. IMAGES: РАЗДАЧА ЗАГРУЖЕННЫХ КАРТИНОК из Docker Volume
        # ============================================================
        location /images/ {
            alias /usr/share/nginx/html/images/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            limit_except GET HEAD {
                deny all;
            }
        }

        # ============================================================
        # 3. HTML/CSS/JS: РАЗДАЧА СТАТИКИ (index.html, upload.html и т.д.)
        # ============================================================
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ============================================================
        # 4. HEALTH CHECK
        # ============================================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}